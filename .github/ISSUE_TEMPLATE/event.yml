name: Submit an event
description: Propose a public event for the ESRA community collection.
title: "[Event] "
body:
  - type: markdown
    attributes:
      value: "For an easier form, start at https://esrarobotics.eu/events/submit/. This issue is public. Include public event details only; no private contact or participant data."
  - type: textarea
    id: details
    attributes:
      label: Event details
      description: Paste the JSON event details prepared by the website, or fill in this example.
      render: json
      value: |
        {
          "title": "Your event",
          "organiser": "Your robotics club",
          "location": "City, Country",
          "type": "Workshops",
          "start": "2027-03-01T10:00:00+01:00",
          "end": "2027-03-01T18:00:00+01:00",
          "url": "https://example.org/event",
          "description": "Programme, audience, language, capacity, accessibility and any costs.",
          "relevance": "Explain the link to ESRA or European student robotics communities."
        }
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Review acknowledgement
      options:
        - label: I am authorised to submit this public event and agree to the ESRA event guidelines.
          required: true
