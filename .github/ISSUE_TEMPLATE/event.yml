name: Submit a community event
description: Propose an event for the ESRA events collection. Publication follows organiser review.
title: "[Event] "
body:
  - type: markdown
    attributes:
      value: "Share public event information only. ESRA will review the submission before publication. Do not include private contact details or participant data."
  - type: input
    id: event-name
    attributes:
      label: Event name
    validations:
      required: true
  - type: input
    id: organiser
    attributes:
      label: Organising club or organisation
      description: Name and public website or profile.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Event type
      options:
        - Hackathon
        - Workshop
        - Meetup
        - Build week
        - Technical visit or exchange
        - Delegation
        - Other
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Dates and timezone
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location or online format
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Event description
      description: What will happen, who is it for, language, eligibility, capacity and any costs?
    validations:
      required: true
  - type: input
    id: registration
    attributes:
      label: Public registration or event URL
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Optional event image URL and credit
      description: Include the image licence or permission for ESRA to use it.
  - type: checkboxes
    id: review
    attributes:
      label: Publication review
      options:
        - label: I am authorised to submit this event and understand that ESRA reviews listings before publication.
          required: true
