name = "esra-events-mail"
main = "worker.mjs"
compatibility_date = "2026-11-09"

[vars]
EMAIL_ENABLED = "false"
APPLICATIONS_ENABLED = "false"
SITE_ORIGIN = "https://esrarobotics.eu"
ALLOWED_ORIGINS = "https://esrarobotics.eu,https://events.esrarobotics.eu"

# Choose an unused namespace in the deploying Cloudflare account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "20271109"
[ratelimits.simple]
limit = 10
period = 60

[observability]
enabled = false
